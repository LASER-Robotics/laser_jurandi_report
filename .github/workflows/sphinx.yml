name: Sphinx build and GitHub Pages

on:
  push:
    branches: ["main"]

  # Permite rodar manualmente na aba "Actions" do GitHub
  workflow_dispatch:

# Permissões necessárias para o GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy simultâneo
concurrency:
  group: "pages"
  cancel-in-running: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências (Sphinx e extensões)
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme myst-parser

      - name: Compilar documentação com Sphinx
        run: |
          make html

      - name: Configurar Pages do GitHub
        uses: actions/configure-pages@v4

      - name: Enviar diretório HTML para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "build/html"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Executar deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
