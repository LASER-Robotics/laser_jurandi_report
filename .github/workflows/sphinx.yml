name: Sphinx build and GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install sphinx sphinx-rtd-theme myst-parser sphinx-design
          fi

      - name: Compilar documentação com Sphinx
        run: |
          make html

      - name: Configurar Pages do GitHub
        uses: actions/configure-pages@v4

      - name: Enviar diretório HTML para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "build/html"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Executar deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
