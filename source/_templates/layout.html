{% extends "!layout.html" %}

{% block extrahead %}
  {{ super() }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <meta property="og:title" content="Projeto Jurandi — Relatório Técnico">
  <meta property="og:description" content="Desenvolvimento, integração e validação de um veículo de superfície autônomo em formato de catamarã.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
{% endblock %}

{% block body %}
  <a class="skip-link" href="#documentacao">Pular para o conteúdo</a>
  {{ super() }}
{% endblock %}

{% block footer %}
  {{ super() }}
  <!-- Botão preto flutuante no canto inferior direito -->
  <a class="pdf-download pdf-download--float"
     href="{{ pathto('_static/' + (pdf_filename | default('relatorio-jurandi.pdf')), 1) }}"
     download
     title="Baixar o relatório completo em PDF">
    <span class="pdf-download__icon" aria-hidden="true">⭳</span>
    <span>Download Report PDF</span>
  </a>
{% endblock %}
